group 'org.maplibre.maplibregl'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'org.maplibre.maplibregl'
    }

    ndkVersion "28.1.13356709"

    defaultConfig {
        minSdkVersion 23
        compileSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    configurations.all {
        // 13.x swapped the artifacts around: 'android-sdk' became Vulkan and
        // 'android-sdk-opengl' keeps OpenGL ES (the backend we were already using
        // on 11.9.0). Exclude the Vulkan one so the annotation/offline plugins'
        // transitive deps don't pull it back in and duplicate classes.
        exclude group: 'org.maplibre.gl', module: 'android-sdk'
    }
    dependencies {
        // 11.9.0 -> 13.6.0 because of the SIGSEGV in mbgl::MessageImpl<...GeoJSONData...>:
        // the Android binding captured a raw 'this' in GeoJSONSource::setAsync's
        // async callback, so destroying the source (removeSource, style reload,
        // MapView dispose) while the Java->core conversion was still in flight ran
        // the reply against freed memory. Fixed upstream in maplibre-native#3976,
        // shipped in 13.0.0. We stay on the OpenGL variant to keep the same renderer.
        implementation 'org.maplibre.gl:android-sdk-opengl:13.6.0'
        implementation 'org.maplibre.gl:android-plugin-annotation-v9:3.0.2'
        implementation 'org.maplibre.gl:android-plugin-offline-v9:3.0.2'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
}
